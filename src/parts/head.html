<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אור יהלומים – OR DIAMONDS</title>
<meta name="description" content="טבעות אירוסין ותכשיטי יהלומי מעבדה בזהב 14K, בהתאמה אישית. בוחרים דגם, צורה וגודל, ומקבלים הצעת מחיר בוואטסאפ.">
<meta property="og:title" content="אור יהלומים – OR DIAMONDS">
<meta property="og:description" content="טבעות אירוסין ותכשיטי יהלומי מעבדה בזהב 14K, בהתאמה אישית.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Assistant:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: "אור" – פתיחה לילית עם אלומת אור שעוברת על המילה, חלונות בצורת קשת כמו חלון ראווה של צורף, פס מתגלגל, ופרק שבו המילים נדלקות בגלילה */
  --night:#15110D;        /* רקע כהה, לילה */
  --night-2:#211A14;
  --linen:#F3EDE4;        /* רקע בהיר, פשתן */
  --sand:#E7DCCB;         /* מילויים ומסגרות */
  --ink:#1F1A15;          /* טקסט */
  --ink-2:#6E6356;        /* טקסט משני */
  --gold:#B8925A;         /* זהב שמפניה – הדגשה */
  --gold-lite:#E9D3A6;
  --glow:#FFF4D9;
  --line:#D8CCBA;
  --f-display:"Bellefair","Frank Ruhl Libre","David",serif;
  --f-body:"Assistant","Arial Hebrew","Arial",sans-serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif;
  --arch:999px 999px 18px 18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--linen);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.skip{position:absolute;right:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;z-index:200}
.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.latin{font-family:var(--f-latin);font-style:italic}
.fill{background:#FBEFC6;color:#5f4b00;padding:0 4px;border-radius:3px}

/* accessibility modes */
html.a11y-big body{font-size:20px}
html.a11y-contrast{--ink:#000;--ink-2:#222;--line:#000;--gold:#7A5A20;--linen:#fff}
html.a11y-contrast .dark,html.a11y-contrast .hero{background:#000!important}
html.a11y-links a{text-decoration:underline!important}

.draft{background:#2A2119;color:#D9C9A8;text-align:center;font-size:12.5px;padding:6px 14px;letter-spacing:.02em}
.draft .fill{background:#5A4520;color:#F5E2B5}

/* NAV */
header.nav{position:sticky;top:0;z-index:50;background:rgba(21,17,13,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#EFE6D6;border-bottom:1px solid rgba(233,211,166,.14)}
.nav-in{max-width:1240px;margin:0 auto;height:66px;padding:0 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.nav-links{display:flex;gap:26px;font-size:14.5px;letter-spacing:.02em}
.nav-links a{text-decoration:none;opacity:.78;padding:6px 0;border-bottom:1px solid transparent;transition:opacity .2s,border-color .2s}
.nav-links a:hover,.nav-links a.on{opacity:1;border-color:var(--gold)}
.logo{display:flex;flex-direction:column;align-items:center;text-decoration:none;line-height:1}
.logo .en{font-family:var(--f-latin);font-size:24px;letter-spacing:.42em;padding-inline-start:.42em;color:#F6EBD4}
.logo .he{font-family:var(--f-display);font-size:13px;letter-spacing:.3em;color:var(--gold-lite);margin-top:5px}
.nav-end{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.bag{background:none;border:1px solid rgba(233,211,166,.35);border-radius:999px;padding:6px 14px;font-size:14px;display:flex;gap:8px;align-items:center;color:#EFE6D6}
.bag .n{background:var(--gold);color:var(--night);border-radius:999px;min-width:20px;height:20px;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.menu-btn{display:none;background:none;border:0;color:#EFE6D6;font-size:14px;padding:8px}
.mnav{display:none}
@media (max-width:900px){
  .nav-in{grid-template-columns:auto 1fr auto}
  .nav-links{display:none}
  .menu-btn{display:block}
  .logo{grid-column:2}
  .logo .en{font-size:19px;letter-spacing:.3em}
  .mnav.on{display:grid;position:fixed;inset:66px 0 0 0;background:var(--night);color:#F3EDE4;z-index:49;padding:28px;align-content:start;gap:2px;overflow:auto}
  .mnav a{font-family:var(--f-display);font-size:30px;text-decoration:none;padding:12px 0;border-bottom:1px solid rgba(233,211,166,.15)}
}

main{display:block}
.view{display:none}.view.on{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.kick{font-size:13px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--night);border:0;border-radius:999px;padding:14px 28px;font-weight:600;font-size:16px;text-decoration:none;transition:transform .25s,background .25s,box-shadow .25s}
.btn:hover{background:#CDA86C;transform:translateY(-2px);box-shadow:0 10px 28px rgba(184,146,90,.35)}
.btn.line{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.btn.line:hover{background:rgba(184,146,90,.12);box-shadow:inset 0 0 0 1px var(--gold)}
.btn.dark{background:var(--night);color:#F6EBD4}
.btn.dark:hover{background:#2C231B}
.arrow::after{content:"←";font-family:var(--f-body)}
.textlink{color:var(--gold);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px;font-weight:600}
.dark{background:var(--night);color:#EFE6D6}
.dark .kick{color:var(--gold-lite)}

/* HERO */
.hero{background:radial-gradient(120% 90% at 70% 10%,#2A2018 0%,var(--night) 55%);color:#EFE6D6;position:relative;overflow:hidden}
.hero-in{max-width:1240px;margin:0 auto;padding:56px 24px 72px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;position:relative;z-index:1}
.hero .word{font-family:var(--f-display);font-size:clamp(150px,26vw,330px);line-height:.82;margin:0 0 6px -.04em;
  background:linear-gradient(100deg,#6E5A3E 0%,#8C7350 38%,var(--glow) 50%,#8C7350 62%,#6E5A3E 100%);background-size:260% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 6.5s cubic-bezier(.6,0,.3,1) .4s infinite}
@keyframes sweep{0%{background-position:100% 0}55%,100%{background-position:0% 0}}
.hero h1{font-size:clamp(30px,3.6vw,48px);color:#F6EBD4;max-width:14em}
.hero .lede{color:#BFB09A;font-size:19px;max-width:30em;margin:18px 0 30px}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap}
.hero .facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:40px;color:#A99C88;font-size:14px}
.hero .facts b{display:block;color:var(--gold-lite);font-family:var(--f-display);font-size:26px;font-weight:400}
.arch{border-radius:var(--arch);overflow:hidden;position:relative;background:var(--sand)}
.arch img{width:100%;height:100%;object-fit:cover}
.hero .arch{aspect-ratio:4/5;max-width:440px;margin-inline-start:auto;box-shadow:0 40px 80px rgba(0,0,0,.45),0 0 0 1px rgba(233,211,166,.18);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
.hero .arch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(21,17,13,.35))}
.hero .tag{position:absolute;bottom:22px;right:22px;z-index:2;background:rgba(21,17,13,.7);backdrop-filter:blur(6px);border:1px solid rgba(233,211,166,.25);border-radius:999px;padding:8px 16px;font-size:13px;color:#EFE6D6}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
.beam{position:absolute;top:-30%;left:30%;width:38%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,236,190,.07),transparent);transform:rotate(18deg);pointer-events:none}
@media (max-width:900px){
  .hero-in{grid-template-columns:1fr;padding:32px 20px 56px;gap:28px}
  .hero .arch{max-width:320px;margin:0 auto;order:-1}
  .hero .word{font-size:clamp(120px,40vw,200px);text-align:center;margin:0}
  .hero h1,.hero .lede{text-align:center;margin-inline:auto}
  .hero .ctas,.hero .facts{justify-content:center}
}

/* MARQUEE */
.ticker{background:var(--gold);color:var(--night);overflow:hidden;white-space:nowrap;border-block:1px solid #A07E4A}
.ticker-in{display:inline-flex;gap:0;animation:tick 38s linear infinite;padding:12px 0}
.ticker span{font-family:var(--f-display);font-size:20px;padding:0 22px}
.ticker i{font-style:normal;opacity:.6}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}

section.sec{padding:110px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:46px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(40px,5.4vw,76px);max-width:11em}
.sec-head p{color:var(--ink-2);max-width:26em;font-size:18px}
@media (max-width:700px){section.sec{padding:72px 0}}

/* SHAPES */
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.shape{background:#FBF8F3;border:1px solid var(--line);border-radius:var(--arch);padding:56px 24px 34px;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:14px;transition:transform .35s,box-shadow .35s,border-color .35s}
.shape:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 24px 50px rgba(110,90,62,.16)}
.shape svg{width:84px;height:84px;color:var(--gold);transition:filter .35s}
.shape:hover svg{filter:drop-shadow(0 0 14px rgba(233,211,166,.9))}
.shape b{font-family:var(--f-display);font-size:34px;font-weight:400}
.shape small{color:var(--ink-2)}
@media (max-width:640px){.shapes{grid-template-columns:repeat(3,1fr);gap:10px}.shape{padding:30px 6px 20px}.shape svg{width:52px;height:52px}.shape b{font-size:24px}.shape small{display:none}}

/* COLLECTION CARDS */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.pcard{text-decoration:none;display:flex;flex-direction:column;gap:12px}
.pcard .pic{position:relative;aspect-ratio:4/5;border-radius:var(--arch);overflow:hidden;background:#FBF8F3;border:1px solid var(--line)}
.pcard .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12%;transition:opacity .6s,transform .8s}
.pcard .pic img.alt{object-fit:cover;padding:0;opacity:0}
.pcard:hover .pic img.alt{opacity:1}
.pcard:hover .pic img.main{transform:scale(1.04)}
.pcard .badge{position:absolute;top:auto;bottom:14px;right:50%;transform:translateX(50%);z-index:2;font-size:11px;letter-spacing:.18em;background:rgba(251,248,243,.92);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink-2);white-space:nowrap}
.pcard h3{font-size:28px}
.pcard .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--ink-2);font-size:15px}
.pcard .price{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pcard.custom .pic{background:var(--night);display:grid;place-items:center;text-align:center;color:#EFE6D6;padding:30px;border-color:#3A2E22}
.pcard.custom .pic b{font-family:var(--f-display);font-size:34px;font-weight:400;display:block;margin-bottom:10px}
.pcard.custom .pic small{color:#BFB09A}
@media (max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.cards{gap:12px}.pcard h3{font-size:22px}.pcard .meta{flex-direction:column;gap:0}}

/* EDITORIAL SPLIT */
.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.split .arch{aspect-ratio:4/5}
.split .duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:end}
.split .duo .arch:last-child{transform:translateY(46px)}
.split h2{font-size:clamp(40px,5vw,68px);margin:14px 0 20px}
.split p{color:var(--ink-2);font-size:18px;max-width:28em}
.split .list{display:grid;gap:12px;margin:26px 0 30px;padding:0;list-style:none}
.split .list li{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px}
.split .list li span{font-family:var(--f-display);color:var(--gold);font-size:22px;min-width:1.4em}
@media (max-width:900px){.split{grid-template-columns:1fr;gap:40px}.split .duo .arch:last-child{transform:translateY(24px)}}

/* LIGHT STORY (scroll-lit words) */
.lightstory{position:relative;overflow:hidden;padding:130px 0}
.lightstory .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.32;filter:saturate(.8)}
.lightstory .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 50%,transparent,var(--night) 85%)}
.lightstory .inner{position:relative;max-width:1000px;margin:0 auto;padding:0 24px;text-align:center}
.lit-text{font-family:var(--f-display);font-size:clamp(36px,5.6vw,80px);line-height:1.18;color:#F6EBD4}
.lit-text .w{opacity:.16;transition:opacity .7s,text-shadow .7s,color .7s}
.lit-text .w.on{opacity:1;text-shadow:0 0 28px rgba(255,236,190,.35)}
.lit-text .w.gold.on{color:var(--gold-lite)}
.lightstory .sub{color:#BFB09A;max-width:34em;margin:34px auto 0;font-size:18px}

/* QUOTE */
.quote{text-align:center;padding:120px 24px}
.quote blockquote{margin:0 auto;max-width:18em;font-family:var(--f-display);font-size:clamp(38px,5vw,70px);line-height:1.15}
.quote blockquote em{font-family:var(--f-latin);color:var(--gold);font-style:italic}
.quote cite{display:block;margin-top:24px;font-style:normal;color:var(--ink-2);letter-spacing:.2em;font-size:13px}

/* STEPS */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}
.step{padding:30px 22px 10px;border-inline-start:1px solid var(--line)}
.step:first-child{border-inline-start:0}
.step .num{font-family:var(--f-display);font-size:84px;line-height:1;color:var(--gold);opacity:.85}
.step b{font-family:var(--f-display);font-size:28px;font-weight:400;display:block;margin:6px 0}
.step p{color:var(--ink-2)}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}.step:nth-child(3){border-inline-start:0}}
@media (max-width:460px){.steps{grid-template-columns:1fr}.step{border-inline-start:0;border-bottom:1px solid var(--line)}}

/* CUSTOM CTA band */
.band{background:var(--night);color:#EFE6D6;border-radius:28px;padding:70px 48px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;position:relative;overflow:hidden}
.band h2{font-size:clamp(38px,4.6vw,64px);color:#F6EBD4}
.band p{color:#BFB09A;font-size:18px;margin:16px 0 26px;max-width:28em}
.band .arch{aspect-ratio:4/5;max-width:300px;margin-inline-start:auto}
@media (max-width:800px){.band{grid-template-columns:1fr;padding:48px 26px}.band .arch{display:none}}

/* FAQ */
.faq{max-width:860px}
details{border-bottom:1px solid var(--line);padding:22px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;font-family:var(--f-display);font-size:26px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--gold);font-size:30px;line-height:1;transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--ink-2);margin-top:10px;max-width:40em}

/* SHOP */
.shop-top{padding:70px 0 40px;text-align:center}
.shop-top h1{font-size:clamp(52px,8vw,110px)}
.shop-top p{color:var(--ink-2);margin-top:10px}
.filters{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.filters button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 20px;font-size:15px}
.filters button.on{background:var(--night);color:#F6EBD4;border-color:var(--night)}
.shop-grid{padding-bottom:110px}

/* PRODUCT */
.crumbs{padding:28px 0 0;font-size:14px;color:var(--ink-2)}
.crumbs a{text-decoration:none}
.buy{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;padding:26px 0 110px;align-items:start}
@media (max-width:900px){.buy{grid-template-columns:1fr;gap:26px}}
.stage-wrap{position:sticky;top:96px}
@media (max-width:900px){.stage-wrap{position:static}}
.stage{aspect-ratio:1/1;border-radius:28px;background:radial-gradient(80% 80% at 50% 40%,#fff 0%,#F6F0E7 70%);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
.stage img.photo{width:86%;height:86%;object-fit:contain;mix-blend-mode:multiply}
.stage img.photo.cover{width:100%;height:100%;object-fit:cover;mix-blend-mode:normal}
.thumbs{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.thumbs button{width:76px;height:76px;border-radius:16px;border:1px solid var(--line);background:#FBF8F3;padding:4px;overflow:hidden}
.thumbs button.on{border:2px solid var(--gold);padding:3px}
.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:12px;mix-blend-mode:multiply}
.photo-note{font-size:12.5px;color:var(--ink-2);text-align:center;margin-top:10px}
.buy .kick{margin-bottom:8px}
.buy h1{font-size:clamp(46px,5.6vw,76px)}
.buy .desc{color:var(--ink-2);font-size:18px;margin:12px 0 10px;max-width:30em}
.step-h{font-family:var(--f-display);font-size:26px;margin:30px 0 4px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:22px}
.step-h span{font-family:var(--f-body);font-size:15px;color:var(--ink-2)}
.step-s{color:var(--ink-2);font-size:14px;margin-bottom:12px}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choice{background:#FBF8F3;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,box-shadow .2s}
.choice:hover{border-color:var(--gold)}
.choice.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 6px 18px rgba(184,146,90,.18);background:#fff}
.choice b{font-weight:600;font-size:17px}
.choice small{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.choice.shape{align-items:center;text-align:center;gap:6px;border-radius:999px 999px 16px 16px;padding-top:18px}
.choice.shape svg{color:var(--ink-2)}
.choice.shape.on svg{color:var(--gold)}
.dot{width:22px;height:22px;border-radius:50%;display:inline-block;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
select{font:inherit;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#FBF8F3;color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);font-weight:600;font-size:14px;margin-top:10px;text-decoration:underline}
.sumbox{background:var(--night);color:#EFE6D6;border-radius:22px;padding:24px;margin-top:30px;display:grid;gap:14px}
.sumbox .p{font-family:var(--f-display);font-size:34px;line-height:1;color:#F6EBD4;font-variant-numeric:tabular-nums}
.sumbox small{color:#BFB09A;font-size:13.5px;display:block;margin-top:6px}
.sumbox .btn{justify-content:center;text-align:center}
.sumbox .sum-note{text-align:center;margin-top:0}
.bag{text-decoration:none}
.bag:hover{border-color:var(--gold-lite)}
.err{color:#B3261E;font-size:14px;min-height:1.2em}
.sumbox .err{color:#FFB4A8}
.assure{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px;font-size:15px}
.assure li{display:flex;gap:10px;align-items:baseline}
.assure li::before{content:"✦";color:var(--gold);font-size:12px}
.custom-strip{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;font-size:15px;color:var(--ink-2)}
.custom-strip a{color:var(--gold);font-weight:600}

/* CUSTOM PAGE */
.custom-hero{background:var(--night);color:#EFE6D6;text-align:center;padding:100px 24px 90px;position:relative;overflow:hidden}
.custom-hero h1{font-size:clamp(48px,7vw,100px);color:#F6EBD4}
.custom-hero p{color:#BFB09A;font-size:19px;max-width:30em;margin:18px auto 30px}
.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:70px 0}
.ideas div{border:1px solid var(--line);border-radius:var(--arch);padding:60px 26px 30px;text-align:center;background:#FBF8F3}
.ideas b{font-family:var(--f-display);font-size:30px;font-weight:400;display:block;margin-bottom:10px}
.ideas p{color:var(--ink-2)}
@media (max-width:760px){.ideas{grid-template-columns:1fr}}

/* CART / CHECKOUT (reused markup) */
.page{padding:60px 24px 110px}
.page > h1{font-size:clamp(46px,6vw,84px);text-align:center;margin-bottom:8px}
.page > .t2{text-align:center;color:var(--ink-2);font-size:18px;margin-bottom:40px}
.line-item{display:grid;grid-template-columns:110px 1fr auto;gap:22px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.line-item .art{background:#FBF8F3;border:1px solid var(--line);border-radius:999px 999px 14px 14px;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden}
.line-item .art img{mix-blend-mode:multiply;width:90%}
.line-item h3{font-size:28px}
.line-item .spec{color:var(--ink-2);font-size:15px;margin-top:4px}
.line-item .end{display:grid;gap:6px;justify-items:end;font-variant-numeric:tabular-nums;font-size:19px}
@media (max-width:520px){.line-item{grid-template-columns:80px 1fr}.line-item .end{grid-column:1/-1;justify-items:start}}
.totals{max-width:440px;margin:26px 0 0 auto;display:grid;gap:10px;font-variant-numeric:tabular-nums}
.totals .row{display:flex;justify-content:space-between}
.totals .grand{font-family:var(--f-display);font-size:32px;border-top:1px solid var(--line);padding-top:14px}
.totals small{color:var(--ink-2)}
.totals .pill,.side .pill{display:block;text-align:center;background:var(--gold);color:var(--night);border-radius:999px;padding:14px 28px;font-weight:600;text-decoration:none;border:0;width:100%}
.pill{display:inline-block;background:var(--gold);color:var(--night);border-radius:999px;padding:13px 26px;font-weight:600;text-decoration:none;border:0}
.pill.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.empty{text-align:center;padding:40px 0;color:var(--ink-2)}
.co-grid{display:grid;grid-template-columns:1fr 400px;gap:48px;align-items:start}
@media (max-width:900px){.co-grid{grid-template-columns:1fr}}
form.co{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form.co .full{grid-column:1/-1}
.field{display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.field input,.field textarea{font:inherit;color:var(--ink);font-size:17px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#FBF8F3}
.field input:focus,.field textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px rgba(184,146,90,.18)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--gold)}
.chk a{color:var(--gold)}
@media (max-width:560px){form.co{grid-template-columns:1fr}}
.side{background:var(--night);color:#EFE6D6;border-radius:22px;padding:26px;display:grid;gap:12px;position:sticky;top:96px}
.side .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;font-size:15px}
.side .grand{font-family:var(--f-display);font-size:30px;border-top:1px solid rgba(233,211,166,.2);padding-top:12px}
.side small{color:#BFB09A}
.paynote{background:#FBF8F3;border:1px dashed var(--gold);border-radius:14px;padding:16px;font-size:14px;color:var(--ink-2)}
.disclose{font-size:13.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:4px}
.disclose b{color:var(--ink)}
.done{max-width:660px;margin:0 auto;text-align:center;padding:100px 24px}
.done .check{width:70px;height:70px;border-radius:50%;background:var(--night);color:var(--gold-lite);display:grid;place-items:center;font-size:30px;margin:0 auto 22px}
.done h1{font-size:clamp(44px,6vw,72px);margin-bottom:14px}
.done p{color:var(--ink-2);font-size:18px;margin-bottom:10px}
.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* DOC PAGES */
.doc{max-width:780px;margin:0 auto;padding:70px 24px 110px}
.doc .kick{display:block;margin-bottom:10px}
.doc h1{font-size:clamp(46px,6vw,80px);margin-bottom:12px}
.doc .upd{color:var(--ink-2);font-size:14px;margin-bottom:28px}
.doc h2{font-size:32px;margin:40px 0 10px}
.doc p,.doc li{color:#3B342C;line-height:1.8}
.doc p+p{margin-top:12px}
.doc ul{padding-inline-start:22px}
.doc .legal-note{background:#FBF3DE;border-radius:14px;padding:14px 18px;color:#5f4b00;font-size:15px;margin-bottom:24px}
.doc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:start;vertical-align:top}
.doc th{color:var(--ink-2);font-weight:500;width:38%}
.doc a{color:var(--gold)}

/* FOOTER */
footer{background:var(--night);color:#BFB09A;font-size:14px}
.foot{max-width:1240px;margin:0 auto;padding:80px 24px 30px}
.foot .big{font-family:var(--f-latin);font-size:clamp(60px,12vw,170px);letter-spacing:.2em;color:#2C241C;line-height:.9;text-align:center;margin-bottom:50px;user-select:none}
.foot .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:30px;padding-bottom:40px;border-bottom:1px solid rgba(233,211,166,.14)}
.foot h4{font-family:var(--f-display);color:#F6EBD4;font-size:22px;font-weight:400;margin:0 0 12px}
.foot a{display:block;text-decoration:none;margin-bottom:8px}
.foot a:hover{color:var(--gold-lite)}
.foot .notes{font-size:12.5px;line-height:1.7;margin-top:22px;color:#8E8170}
.foot .bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:22px;font-size:13px}
.foot .bottom nav{display:flex;gap:18px;flex-wrap:wrap}
.foot .bottom nav a{display:inline;margin:0}
@media (max-width:800px){.foot .cols{grid-template-columns:1fr 1fr}}

/* floating */
.wa{position:fixed;bottom:20px;left:20px;z-index:60;background:#1F7A4D;color:#fff!important;border-radius:999px;padding:12px 18px;font-weight:600;font-size:15px;box-shadow:0 10px 28px rgba(0,0,0,.22);text-decoration:none}
.a11y-btn{position:fixed;bottom:20px;right:20px;z-index:60;background:var(--night);color:#F6EBD4;border:1px solid rgba(233,211,166,.3);border-radius:999px;padding:12px 16px;font-size:14px}
.a11y-panel{position:fixed;bottom:78px;right:20px;z-index:61;background:#FBF8F3;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.2);padding:18px;width:260px;display:none}
.a11y-panel.on{display:grid;gap:8px}
.a11y-panel h3{font-size:22px;margin-bottom:4px}
.a11y-panel button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:start;font-size:15px}
.a11y-panel button[aria-pressed="true"]{background:var(--night);color:#F6EBD4}
.a11y-panel a{color:var(--gold);font-size:14px}
.cookie{position:fixed;bottom:20px;right:50%;transform:translateX(50%);z-index:70;background:rgba(21,17,13,.96);color:#EFE6D6;border:1px solid rgba(233,211,166,.25);border-radius:18px;padding:14px 18px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:min(640px,calc(100% - 32px))}
.cookie a{color:var(--gold-lite)}
.cookie button{background:var(--gold);color:var(--night);border:0;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;flex:none}
.toast{position:fixed;top:84px;right:50%;transform:translateX(50%);background:var(--night);color:#F6EBD4;border:1px solid rgba(233,211,166,.3);padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:80;font-size:15px}
.toast.on{opacity:1}
@media (max-width:900px){.wa,.a11y-btn{bottom:14px;padding:11px 14px}.wa{left:14px}.a11y-btn{right:14px}.cookie{bottom:70px;right:14px;left:14px;transform:none;max-width:none;padding:12px 14px;font-size:13.5px;gap:12px}}
.nw{white-space:nowrap}
dialog{border:0;border-radius:24px;padding:0;max-width:520px;width:calc(100% - 32px);background:#FBF8F3;color:var(--ink)}
dialog::backdrop{background:rgba(21,17,13,.55);backdrop-filter:blur(4px)}
.dlg{padding:30px}
.dlg h2{font-size:34px;margin-bottom:10px}
.dlg p{color:var(--ink-2);margin-bottom:10px}
table.sizes{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:12px 0}
table.sizes th,table.sizes td{border-bottom:1px solid var(--line);padding:7px;text-align:center}

/* reveal on scroll – visible at rest, gently lifts when JS adds .in */
.rv{transition:transform 1s cubic-bezier(.2,.7,.2,1),opacity 1s}
.js .rv:not(.in){transform:translateY(26px);opacity:.35}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .hero .word{background-position:50% 0}
  .lit-text .w{opacity:1}
  .js .rv:not(.in){transform:none;opacity:1}
}
</style>
</head>
